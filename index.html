<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#b71c1c">
  <title>দ্য ইনসাইড রিপোর্ট বিডি</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="top">
      <h1>দ্য ইনসাইড রিপোর্ট <span>বিডি</span></h1>
      <div class="actions">
        <button id="btnTheme" aria-label="থিম বদলান">🌓</button>
        <button id="btnRefresh" aria-label="রিফ্রেশ">⟳</button>
      </div>
    </div>
    <input id="search" type="search" placeholder="খবর খুঁজুন...">
    <div id="chips" class="chips"></div>
  </header>

  <main>
    <div id="status" class="status"></div>
    <div id="list"></div>
  </main>

  <nav>
    <button id="tabAll" class="active">সব খবর</button>
    <button id="tabSaved">সংরক্ষিত</button>
  </nav>

  <script src="config.js"></script>
  <script src="sources.js"></script>
  <script src="app.js"></script>
</body>
</html>
